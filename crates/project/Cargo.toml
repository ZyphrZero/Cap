[package]
name = "cap-project"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
cap-cursor-info = { path = "../cursor-info" }

specta.workspace = true
serde = { workspace = true }
bincode = { version = "2.0.1", features = ["serde"] }

serde_json = "1.0.150"
either = "1.16.0"
relative-path = { version = "2.0.1", features = ["serde"] }
log = "0.4"
tracing = "0.1.44"
tempfile = "3.27.0"
uuid = { version = "1.23.4", features = ["v4"]}
workspace-hack = { version = "0.1", path = "../workspace-hack" }
